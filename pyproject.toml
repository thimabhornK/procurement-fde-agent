[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procurement-intelligence-agent"
version = "0.2.0"
description = "Contract risk review, vendor scoring and ERP lookups for procurement, on Gemini and LangGraph"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0",
  "langgraph>=0.2",
  "chromadb>=0.5",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
app = ["streamlit>=1.35"]
dev = ["pytest>=8", "ruff>=0.5", "mcp>=1.2"]

[tool.setuptools.packages.find]
include = ["procurement_agent*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"procurement_agent/sample_data.py" = ["E501"]
